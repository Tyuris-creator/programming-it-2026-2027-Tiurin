<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Задачи + свой API</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      input {
        flex: 1;
        padding: 0.5rem;
      }
      button {
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 0;
        border-bottom: 1px solid #eee;
      }
      .status {
        color: #666;
        margin-bottom: 1rem;
      }
      .error {
        color: #c00;
      }
    </style>
  </head>
  <body>
    <h1>Мои задачи</h1>
    <p class="status" id="status">Загрузка…</p>

    <form id="form">
      <input id="title" type="text" placeholder="Новая задача" required />
      <button type="submit">Добавить</button>
    </form>

    <ul id="list"></ul>

    <script src="./frontend.js"></script>
  </body>
</html>
